<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Christopher Brown's little corner of the internet.">
  <meta name="theme-color" content="#f7f2e9">
  <title>Christopher Brown</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="stylesheet" href="styles.css?v=20260831-12">

<body>
  <!--
  THESIS: A personal calling card with one changing cartoon, not a résumé or portfolio funnel.
  OWN-WORLD: Warm paper, teal, burnt orange, mustard, charcoal, rounded type, and mid-century geometric marks.
  STORY: Catch a little personality, then choose one of four simple ways to say hello or look around.
  FIRST VIEWPORT: A large rotating illustration anchors the page; four contact links sit beneath it in a centered row.
  FORM: User-pinned mid-century cartoon calling card; seed 9b715519 was superseded by the supplied references.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
  -->
  <a class="skip-link" href="#hello">Skip to Christopher Brown</a>

  <div class="ambient" aria-hidden="true">
    <span class="ambient__shape ambient__shape--teal"></span>
    <span class="ambient__shape ambient__shape--orange"></span>
    <span class="ambient__shape ambient__shape--mustard"></span>
    <span class="ambient__spark ambient__spark--one"></span>
    <span class="ambient__spark ambient__spark--two"></span>
  </div>

  <div class="page-shell">
    <main class="landing" id="hello">
      <section class="calling-card" aria-label="Christopher Brown's online links">
        <button class="portrait-stage" type="button" data-portrait-shuffle aria-label="Show another cartoon illustration of Chris">
          <span class="portrait-stage__sun" aria-hidden="true"></span>
          <img class="portrait-stage__image" data-random-portrait alt="" decoding="async" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
          <div class="portrait-stage__fallback" data-portrait-fallback aria-hidden="true">
            <span>CB</span>
          </div>
          <span class="portrait-stage__shuffle" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M20 11a8 8 0 0 0-14.9-4M4 4v5h5M4 13a8 8 0 0 0 14.9 4M20 20v-5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>

        <nav class="social-links" aria-label="Find Chris elsewhere">
          <a class="social-link social-link--brand" href="https://www.linkedin.com/in/christopherrbrown3/" rel="me">
            <!-- Official LinkedIn [in] logo: https://brand.linkedin.com/in-logo -->
            <svg class="social-link__brand-mark" viewBox="0 0 28 28" aria-hidden="true">

            </svg>
            <span>LinkedIn</span>
          </a>

          <a class="social-link social-link--brand" href="https://github.com/christopherrbrown3" rel="me">
            <!-- Official GitHub Invertocat: https://brand.github.com/foundations/logo -->
            <svg class="social-link__brand-mark" viewBox="0 0 98 96" aria-hidden="true">
              <path fill="#000000" d="M41.4395 69.3848C28.8066 67.8535 19.9062 58.7617 19.9062 46.9902C19.9062 42.2051 21.6289 37.0371 24.5 33.5918C23.2559 30.4336 23.4473 23.7344 24.8828 20.959C28.7109 20.4805 33.8789 22.4902 36.9414 25.2656C40.5781 24.1172 44.4062 23.543 49.0957 23.543C53.7852 23.543 57.6133 24.1172 61.0586 25.1699C64.0254 22.4902 69.2891 20.4805 73.1172 20.959C74.457 23.543 74.6484 30.2422 73.4043 33.4961C76.4668 37.1328 78.0937 42.0137 78.0937 46.9902C78.0937 58.7617 69.1934 67.6621 56.3691 69.2891C59.623 71.3945 61.8242 75.9883 61.8242 81.252L61.8242 91.2051C61.8242 94.0762 64.2168 95.7031 67.0879 94.5547C84.4102 87.9512 98 70.6289 98 49.1914C98 22.1074 75.9883 6.69539e-07 48.9043 4.309e-07C21.8203 1.92261e-07 -1.9479e-07 22.1074 -4.3343e-07 49.1914C-6.20631e-07 70.4375 13.4941 88.0469 31.6777 94.6504C34.2617 95.6074 36.75 93.8848 36.75 91.3008L36.75 83.6445C35.4102 84.2188 33.6875 84.6016 32.1562 84.6016C25.8398 84.6016 22.1074 81.1563 19.4277 74.7441C18.375 72.1602 17.2266 70.6289 15.0254 70.3418C13.877 70.2461 13.4941 69.7676 13.4941 69.1934C13.4941 68.0449 15.4082 67.1836 17.3223 67.1836C20.0977 67.1836 22.4902 68.9063 24.9785 72.4473C26.8926 75.2227 28.9023 76.4668 31.2949 76.4668C33.6875 76.4668 35.2187 75.6055 37.4199 73.4043C39.0469 71.7773 40.291 70.3418 41.4395 69.3848Z"/>
            </svg>
            <span>GitHub</span>
          </a>

          <a class="social-link social-link--email" href="#email" data-email-link data-email-code="aGVsbG9AY2hyaXN0b3BoZXJicm93bi5pbw==" aria-label="Send an email">
            <!-- Heroicons envelope, solid: https://heroicons.com/ -->
            <svg class="social-link__utility-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M1.5 8.67v8.58a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V8.67l-8.928 5.493a3 3 0 0 1-3.144 0L1.5 8.67Z"/>
              <path fill="currentColor" d="M22.5 6.908V6.75a3 3 0 0 0-3-3h-15a3 3 0 0 0-3 3v.158l9.714 5.978a1.5 1.5 0 0 0 1.572 0L22.5 6.908Z"/>
            </svg>
            <span>Email</span>
          </a>

          <a class="social-link social-link--resume" href="resume.pdf" download>
            <!-- Heroicons document-text, solid: https://heroicons.com/ -->
            <svg class="social-link__utility-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" fill-rule="evenodd" d="M5.25 2.25A2.25 2.25 0 0 0 3 4.5v15a2.25 2.25 0 0 0 2.25 2.25h13.5A2.25 2.25 0 0 0 21 19.5V9.108a2.25 2.25 0 0 0-.659-1.591l-4.858-4.858A2.25 2.25 0 0 0 13.892 2.25H5.25Zm9 1.5v4.5h4.5l-4.5-4.5ZM6.75 12a.75.75 0 0 1 .75-.75h9a.75.75 0 0 1 0 1.5h-9a.75.75 0 0 1-.75-.75Zm0 3a.75.75 0 0 1 .75-.75h9a.75.75 0 0 1 0 1.5h-9a.75.75 0 0 1-.75-.75Zm0 3a.75.75 0 0 1 .75-.75H12a.75.75 0 0 1 0 1.5H7.5a.75.75 0 0 1-.75-.75Z" clip-rule="evenodd"/>
            </svg>
            <span>Résumé</span>
          </a>
        </nav>
      </section>
    </main>

    <footer class="site-footer">
      <span>© <span data-year></span> Christopher Brown</span>
      <span aria-hidden="true">·</span>
      <span>Alexandria, Virginia</span>
    </footer>
  </div>

  <script id="landing-illustrations" type="text/plain">
    {% for image in site.static_files %}
      {% if image.path contains '/images/landing/' %}
        {% assign extension = image.extname | downcase %}
        {% if extension == '.png' or extension == '.jpg' or extension == '.jpeg' or extension == '.webp' or extension == '.avif' or extension == '.gif' or extension == '.svg' %}
          {{ image.path | jsonify }}
        {% endif %}
      {% endif %}
    {% endfor %}
  </script>
  <script src="script.js?v=20260831-4"></script>
