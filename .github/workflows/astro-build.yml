name: Check Astro redesign

on:
  pull_request:
    paths:
      - 'site-v2/**'
      - '.github/workflows/astro-build.yml'
  push:
    branches:
      - redesign/astro-v2
    paths:
      - 'site-v2/**'
      - '.github/workflows/astro-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-v2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-v2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Build static site
        run: npm run build

