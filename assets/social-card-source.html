<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Christopher Brown social card</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { color: #142820; background: #f3eee6; font-family: "Avenir Next", "Segoe UI", Arial, sans-serif; }
    main { position: relative; width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 360px; gap: 68px; align-items: center; padding: 64px 74px; }
    main::before { content: ""; position: absolute; inset: 40px; border: 1px solid rgba(20,40,32,.18); }
    .copy { position: relative; z-index: 1; }
    .label { display: flex; align-items: center; gap: 14px; margin: 0 0 28px; color: #8f3929; font: 700 12px/1.4 "SFMono-Regular", Consolas, monospace; letter-spacing: .09em; text-transform: uppercase; }
    .label::before { content: ""; width: 40px; height: 1px; background: currentColor; }
    h1 { max-width: 720px; margin: 0; font: 500 68px/.98 "Iowan Old Style", Palatino, Georgia, serif; letter-spacing: -.045em; }
    h1 em { color: #ae4e36; }
    .name { margin: 34px 0 0; font-size: 18px; font-weight: 800; }
    .role { margin: 4px 0 0; color: #5b6963; font-size: 14px; }
    .portrait { position: relative; z-index: 1; padding: 10px 0 0 10px; }
    .portrait::before { content: ""; position: absolute; inset: 0 10px 10px 0; border: 1px solid #ae4e36; border-radius: 180px 180px 0 0; }
    img { position: relative; width: 100%; height: 440px; display: block; object-fit: cover; object-position: center 39%; border-radius: 175px 175px 0 0; }
    .mark { position: absolute; right: 51px; bottom: 48px; z-index: 2; width: 66px; height: 66px; display: grid; place-items: center; color: #f3eee6; background: #153c32; border: 1px solid #e4a083; border-radius: 50%; font: 600 22px Georgia, serif; }
  </style>
</head>
<body>
  <main>
    <div class="copy">
      <p class="label">Enterprise customer engineering · Post-sales operations</p>
      <h1>I scale the teams and operating systems behind <em>enterprise trust.</em></h1>
      <p class="name">Christopher Brown</p>
      <p class="role">Customer trust · Applied AI operations · Talent systems</p>
    </div>
    <div class="portrait"><img src="christopher-brown-800.jpg" alt=""></div>
    <div class="mark">CB</div>
  </main>
</body>
</html>
